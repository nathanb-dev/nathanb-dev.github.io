<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Escaper</title>
  </head>
  <body>
    <main>
      <h1>String Escaper</h1>
      <p class="subtitle">Turn plain text into an escaped string literal for C-like languages.</p>

      <section>
        <label class="lbl" for="input">Plain text</label>
        <div class="output-wrap">
          <textarea id="input" spellcheck="false" placeholder="Type or paste text here"></textarea>
          <button id="paste-btn" class="icon-btn" type="button" title="Paste from clipboard" aria-label="Paste from clipboard">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="2" width="8" height="4" rx="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            </svg>
          </button>
        </div>
      </section>

      <section class="options">
        <label class="field">
          <span class="lbl">Language</span>
          <select id="language"></select>
        </label>
        <label class="field">
          <span class="lbl">Quote</span>
          <select id="quote"></select>
        </label>
        <label class="field">
          <span class="lbl">Non-ASCII characters</span>
          <select id="non-ascii"></select>
        </label>
      </section>

      <section class="checks">
        <label class="check"><input type="checkbox" id="wrap" checked> Wrap in quotes</label>
        <label class="check"><input type="checkbox" id="split"> Split lines into separate literals</label>
        <label class="check"><input type="checkbox" id="invisible" checked> Escape invisible characters</label>
        <label class="check"><input type="checkbox" id="upper"> Uppercase hex digits</label>
        <label class="check"><input type="checkbox" id="both"> Escape both quote types</label>
        <label class="check" data-langs="js"><input type="checkbox" id="es6"> Use \u{…} for characters above U+FFFF</label>
        <label class="check" data-langs="js,json"><input type="checkbox" id="slash"> Escape "/" as "\/"</label>
        <label class="check" data-langs="c"><input type="checkbox" id="trigraph"> Break up trigraphs ("??")</label>
        <div class="reset-row">
          <button id="reset-btn" class="link-btn" type="button">Reset to defaults</button>
        </div>
      </section>

      <section>
        <label class="lbl" for="output">Escaped output</label>
        <div class="output-wrap">
          <textarea id="output" readonly spellcheck="false" placeholder="Your escaped string will appear here"></textarea>
          <button id="copy-btn" class="icon-btn" type="button" title="Copy to clipboard" aria-label="Copy to clipboard">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="12" height="12" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </section>
      <p class="footer"><button id="cookie-prefs" class="link-btn" type="button">Cookie preferences</button></p>
    </main>
    <div id="consent-banner" role="dialog" aria-label="Cookie consent" hidden>
      <p>This page can use a cookie to remember your option choices (language, quote style, and so on). Your text is never stored or sent anywhere.</p>
      <div class="consent-actions">
        <button id="consent-decline" type="button">Decline</button>
        <button id="consent-accept" type="button" class="primary">Accept</button>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite">Copied!</div>
    <script src="./script.js"></script>
  </body>
</html>
